<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجمع الخدمات درايف ثرو — مجسم ليلي ثلاثي الأبعاد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070b;--fg:#f3e9d2;--mut:#9aa3b2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Cairo',Tahoma,Arial,sans-serif;overflow:hidden}
header{text-align:center;padding:10px 12px 2px}
h1{margin:0;font-size:clamp(17px,4vw,24px);font-weight:800}
header p{margin:2px 0 0;color:var(--mut);font-size:13px}
#v{position:absolute;top:70px;bottom:56px;left:0;right:0;touch-action:none}
canvas{display:block;width:100%;height:100%}
nav{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;font-weight:800;font-size:14px;color:var(--fg);background:#1a2130;border:1px solid #2c3750;border-radius:20px;padding:8px 16px}
button:active{background:#2c3750}
</style>
</head>
<body>
<header><h1>مجمع الخدمات درايف ثرو</h1><p>عرض ٤٠ م × طول ٢٠٠ م · اسحب للتدوير · اضغط وكبّر للتقريب</p></header>
<div id="v"></div>
<nav><button data-v="0">من المدخل</button><button data-v="1">منظر علوي</button><button data-v="2">من المخرج</button><button data-v="3">قريب</button></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
document.fonts.ready.then(()=>{
const T=THREE,box=document.getElementById('v');
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));box.appendChild(R.domElement);
const S=new T.Scene();S.background=new T.Color(0x070a12);S.fog=new T.FogExp2(0x070a12,.0018);
const C=new T.PerspectiveCamera(45,1,1,900);
S.add(new T.HemisphereLight(0x5a6a99,0x14141c,.75));
const mo=new T.DirectionalLight(0x9fb4ff,.45);mo.position.set(-60,90,50);S.add(mo);
const mat=(c,e,ei)=>new T.MeshStandardMaterial({color:c,roughness:.85,metalness:.05,emissive:e||0,emissiveIntensity:ei||0});
const add=(g,m,x,y,z)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);S.add(o);return o};
const bx=(w,h,d)=>new T.BoxGeometry(w,h,d);
function tex(f){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');f(x);return new T.CanvasTexture(c)}
const glowT=tex(x=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128)});
const beamT=tex(x=>{const g=x.createLinearGradient(0,128,0,0);g.addColorStop(0,'rgba(255,240,190,.7)');g.addColorStop(1,'rgba(255,240,190,0)');x.fillStyle=g;x.fillRect(0,0,128,128)});
const glow=(c,x,y,z,s)=>{const o=new T.Sprite(new T.SpriteMaterial({map:glowT,color:c,blending:T.AdditiveBlending,transparent:true,depthWrite:false}));o.position.set(x,y,z);o.scale.set(s,s,1);S.add(o)};
function label(t,col,x,y,z,w){const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');
 g.fillStyle=col;g.beginPath();g.roundRect?g.roundRect(6,6,500,116,22):g.rect(6,6,500,116);g.fill();
 g.fillStyle='#fff';g.font='800 62px Cairo,Tahoma,Arial';g.textAlign='center';g.textBaseline='middle';g.direction='rtl';g.fillText(t,256,68,470);
 const o=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true}));o.position.set(x,y,z);o.scale.set(w,w/4,1);S.add(o)}
// ground
const rp=(w,d,c,x,z,y=0)=>{const o=add(new T.PlaneGeometry(w,d),mat(c),x,y,z);o.rotation.x=-Math.PI/2;return o};
rp(900,900,0x2a2218,0,0,-.05);rp(40,200,0x1a1d24,0,0);rp(5,200,0x14381d,-17.5,0,.02);rp(9,200,0x143a1f,15.5,0,.02);
rp(400,14,0x20232b,0,108);rp(400,14,0x20232b,0,-108);
[-9,0,9].forEach(x=>{for(let z=95;z>-100;z-=8)rp(.12,3,0xffffff,x,z,.03).material.opacity=.35});
[-13.5,-4.5,4.5].forEach(x=>rp(5,200,0x2c2f36,x,0,.02));
// car wash: walls over K columns, ceilings over lanes, open tunnels
[-13.5,-4.5,4.5].forEach(x=>add(bx(5,5.5,40),mat(0x4a5360),x,2.75,80));
[-9,0,9].forEach(x=>{add(bx(4,1.5,40),mat(0x5a6573),x,4.75,80);
 [100,60].forEach(z=>{add(bx(4,.12,.12),mat(0,0x5cc8ff,2),x,4,z+(z>80?-.1:.1));glow(0x5cc8ff,x,2.5,z,14)});
 const l=new T.PointLight(0x5cc8ff,.9,24);l.position.set(x,3.5,80);S.add(l);});
label('مغسلة سيارات — ٣ مسارات درايف ثرو','#1b8fcf',-2.5,9.5,80,22);
// kiosks
const KC=[-13.5,-4.5,4.5],ST=[[30,'ماركت صغير','#2f8f4e',0x2f8f4e],[0,'مقهى','#c9672a',0xc9672a],[-30,'مغسلة ملابس','#7b5cc4',0x7b5cc4]];
KC.forEach((x,i)=>ST.forEach(([z,t,col,hc])=>{
 add(bx(4.4,3.4,14),mat(0xcdbba0),x,1.7,z);add(bx(5,.4,14.6),mat(hc),x,3.6,z);
 add(bx(.12,1.4,8),mat(0xffd27a,0xffc060,2.2),x+2.22,1.9,z);add(bx(1,.2,8.6),mat(hc),x+2.7,2.9,z);
 glow(0xffc870,x+3.5,1.9,z,13);if(i==1){const l=new T.PointLight(0xffc870,.8,16);l.position.set(x+3.5,2.5,z);S.add(l)}
 if(i==1)label(t,col,x,7,z,10)}));
// planters + lamps + trees
const palm=(x,z,h=7)=>{add(new T.CylinderGeometry(.25,.4,h,6),mat(0x5b4630),x,h/2,z);for(let k=0;k<6;k++){const a=k*1.05,l=add(new T.SphereGeometry(1.7,6,4),mat(0x1f6b2b),x+Math.cos(a)*1.6,h+.3,z+Math.sin(a)*1.6);l.scale.set(1.4,.25,.6);l.rotation.y=-a;}};
const bush=(x,z)=>add(new T.SphereGeometry(1.2,8,6),mat(0x1d5a28),x,.9,z);
KC.forEach(x=>[48,15,-15,-45,-72,-92].forEach(z=>{add(bx(3,.8,3),mat(0x3a3a3a),x,.4,z);bush(x,z)}));
KC.forEach(x=>[52,18,-14,-46,-75].forEach(z=>{add(new T.CylinderGeometry(.12,.15,8,6),mat(0x333844),x+1.5,4,z);add(new T.SphereGeometry(.4,8,6),mat(0xfff0c8,0xffe2a0,3),x+1.5,8,z);glow(0xffd88a,x+1.5,8,z,16);}));
for(let z=-90;z<=90;z+=16){palm(-18,z,6+(z%3));palm(18.5,z+6,8);}
[36,0,-36].forEach(z=>{add(new T.CylinderGeometry(1.3,1.3,.9,12),mat(0x5a4a38),14.5,.45,z);[-2.2,2.2].forEach(d=>add(new T.CylinderGeometry(.5,.5,.5,8),mat(0xb9925e),14.5+d,.25,z));glow(0xffc870,14.5,2,z,10)});
// fence (black translucent) + exit gates
const fm=new T.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.45});
const fw=(w,d,x,z)=>add(bx(w,2.6,d),fm,x,1.3,z);
fw(.15,200,-20,0);fw(.15,200,20,0);fw(4,.15,-18,100);fw(9,.15,15.5,100);
[[-20,-11],[-7,-2],[2,7],[11,20]].forEach(([a,b])=>fw(b-a,.15,(a+b)/2,-100));
for(let z=-100;z<=100;z+=6){add(bx(.3,2.8,.3),mat(0x111111),-20,1.4,z);add(bx(.3,2.8,.3),mat(0x111111),20,1.4,z)}
[-9,0,9].forEach(x=>{add(bx(3.4,.25,.25),mat(0xdd3322,0xdd3322,1),x,1.1,-100);glow(0xff3322,x,1.4,-100,6)});
label('مخرج — ٣ مسارات','#d3402a',0,6,-100,16);
// cars
function mkCar(c){const g=new T.Group(),m=mat(c);
 const a=new T.Mesh(bx(1.9,.75,4.3),m);a.position.y=.7;g.add(a);
 const b=new T.Mesh(bx(1.6,.65,2.3),mat(0x0b0f16));b.position.set(0,1.35,.3);g.add(b);
 [-.7,.7].forEach(d=>{const h=new T.Mesh(bx(.4,.2,.1),mat(0xfff6d0,0xfff2b0,3));h.position.set(d,.75,-2.18);g.add(h);const t=new T.Mesh(bx(.4,.2,.1),mat(0x660000,0xff2200,2));t.position.set(d,.75,2.18);g.add(t)});
 const bm=new T.Mesh(new T.PlaneGeometry(3.2,10),new T.MeshBasicMaterial({map:beamT,transparent:true,blending:T.AdditiveBlending,depthWrite:false}));bm.rotation.x=-Math.PI/2;bm.position.set(0,.06,-7.3);g.add(bm);
 S.add(g);return g}
[[-9,72,0xaa2222],[-9,30,0xdddddd],[-9,-60,0x3a6ea8],[0,60,0xeeeeee],[0,0,0xa65a22],[0,-82,0x333333],[9,85,0x5599cc],[9,-30,0xcccccc],[9,-92,0xaa2222]].forEach(([x,z,c])=>{mkCar(c).position.set(x,0,z)});
const mv=mkCar(0xffb703);mv.position.set(0,0,130);
const wp=[[130,0],[80,2],[30,2.4],[0,2.4],[-30,2.4],[-130,0]],V=14;let tl=[],tt=0;
for(let i=1;i<wp.length;i++){const d=(wp[i-1][0]-wp[i][0])/V;tl.push([tt,tt+d,wp[i-1][0],wp[i][0]]);tt+=d+wp[i][1]}
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
// camera orbit
const P=[[.55,1.0,250],[.0,.35,300],[Math.PI+.5,1.0,250],[.9,1.25,95]];let cur={t:.55,p:1.0,r:250},tg={t:.55,p:1.0,r:250},cy=[0,0,10];
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{const v=P[+b.dataset.v];tg={t:v[0],p:v[1],r:v[2]};if(b.dataset.v==3)cy=[0,0,40];else cy=[0,0,10]});
let dr=null;R.domElement.onpointerdown=e=>{dr=[e.clientX,e.clientY];R.domElement.setPointerCapture(e.pointerId)};
R.domElement.onpointerup=()=>dr=null;
R.domElement.onpointermove=e=>{if(!dr)return;tg.t-=(e.clientX-dr[0])*.006;tg.p=Math.min(1.45,Math.max(.15,tg.p-(e.clientY-dr[1])*.005));dr=[e.clientX,e.clientY]};
R.domElement.onwheel=e=>{e.preventDefault();tg.r=Math.min(420,Math.max(40,tg.r+e.deltaY*.2))};
function size(){const w=box.clientWidth,h=box.clientHeight;R.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix()}
addEventListener('resize',size);size();
const t0=performance.now();
(function loop(){const t=(performance.now()-t0)/1000;
 ['t','p','r'].forEach(k=>cur[k]+=(tg[k]-cur[k])*.07);
 C.position.set(cy[0]+cur.r*Math.sin(cur.p)*Math.sin(cur.t),cur.r*Math.cos(cur.p),cy[2]+cur.r*Math.sin(cur.p)*Math.cos(cur.t));C.lookAt(cy[0],0,cy[2]);
 if(!calm){const q=t%tt;let z=wp[0][0];for(const s of tl){if(q>=s[0]&&q<=s[1]){const k=(q-s[0])/(s[1]-s[0]);z=s[2]+(s[3]-s[2])*(k*k*(3-2*k));break}if(q>s[1])z=s[3]}mv.position.z=z}
 R.render(S,C);requestAnimationFrame(loop)})();
});
</script>
</body>
</html>
